<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b7a4b">
  <title>Feirinha</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Feirinha">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="welcome" id="welcome" hidden>
    <div class="welcome-box">
      <h1>Instale o app antes de usar</h1>
      <ol>
        <li>Toque em <b>Compartilhar</b> (o quadrado com a seta).</li>
        <li>Toque em <b>“Adicionar à Tela de Início”</b>.</li>
        <li>Abra a <b>Feirinha</b> pelo ícone que apareceu.</li>
      </ol>
      <p><b>Use sempre pelo ícone:</b> os produtos e as vendas ficam guardados lá.</p>
      <button type="button" class="btn link" id="welcome-skip">Continuar no navegador mesmo assim</button>
    </div>
  </div>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="vender">Vender</button>
    <button type="button" data-tab="pedidos">Pedidos</button>
    <button type="button" data-tab="produtos">Produtos</button>
    <button type="button" data-tab="resumo">Resumo</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
